<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>实验报告生成器（MATLAB）</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ==================== 编辑面板（打印时自动隐藏） ==================== -->
<div class="panel no-print">
  <h2>实验报告（MATLAB）</h2>
  <div class="grid">
    <div class="field"><label>课程名称</label><input type="text" id="iCourse" placeholder="如：数值计算方法"></div>
    <div class="field"><label>实验名称</label><input type="text" id="iName" placeholder="如：实验三 数值积分与插值"></div>
    <div class="field"><label>姓    名</label><input type="text" id="iStudent"></div>
    <div class="field"><label>学    号</label><input type="text" id="iId"></div>
    <div class="field"><label>专业班级</label><input type="text" id="iClass"></div>
    <div class="field"><label>实验日期</label><input type="text" id="iDate"></div>

    <div class="field full">
      <label>一、实验题目 <em></em></label>
      <textarea id="iPurpose" placeholder="每行写一条"></textarea>
      <div class="upload-row">
        <label class="upload-btn">
          <input type="file" id="iPurposeImages" accept="image/*" multiple hidden>
          ＋ 添加目的图片
        </label>
        <span class="upload-hint">可选，支持多张</span>
      </div>
      <div class="thumb-list" id="thumbListPurpose"></div>
    </div>

    <div class="field full">
      <label>二、实验原理 / 实验内容 <em>（可留空）</em></label>
      <textarea id="iPrinciple"></textarea>
    </div>
    <div class="field full">
      <label>三、实验环境 <em>（可留空）</em></label>
      <textarea id="iEnv" placeholder="如：Windows 11 + MATLAB R2023a"></textarea>
    </div>

    <div class="field full">
      <label>四、MATLAB 源代码</label>
      <textarea id="iCode" spellcheck="false" placeholder="在此粘贴你的 MATLAB 代码……"></textarea>
    </div>

    <div class="field full">
      <label>五、运行结果 <em>（可留空）</em></label>
      <textarea id="iResult" placeholder="可直接粘贴命令窗口输出"></textarea>
    </div>

    <div class="field full">
      <label>运行结果截图 <em>（可选，支持多张）</em></label>
      <div class="upload-row">
        <label class="upload-btn">
          <input type="file" id="iResultImages" accept="image/*" multiple hidden>
          ＋ 添加结果图片
        </label>
        <span class="upload-hint">可选，支持多张</span>
      </div>
      <div class="thumb-list" id="thumbListResult"></div>
    </div>

    <div class="field full">
      <label>六、实验总结 <em>（可留空）</em></label>
      <textarea id="iSummary"></textarea>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-primary" id="btnGenerate">生成报告</button>
    <button class="btn-ghost" id="btnPrint">导出 PDF</button>
    <label class="check"><input type="checkbox" id="iHighlight" checked> 代码语法高亮</label>
    <label class="check"><input type="checkbox" id="iAutoSave" checked> 自动保存草稿</label>
    <button class="btn-ghost" id="btnClear">清空</button>
    <span class="status" id="status"></span>
  </div>
</div>

<!-- ==================== 报告正文 ==================== -->
<div id="report">
  <div class="rpt-head">
    <h1 class="rpt-title" id="rTitle">实验报告</h1>
    <div class="rpt-sub" id="rSub"></div>
  </div>

  <div class="meta">
    <div><span class="k">课程名称：</span><span class="v" id="mCourse"></span></div>
    <div><span class="k">实验名称：</span><span class="v" id="mName"></span></div>
    <div><span class="k">姓　　名：</span><span class="v" id="mStudent"></span></div>
    <div><span class="k">学　　号：</span><span class="v" id="mId"></span></div>
    <div><span class="k">专业班级：</span><span class="v" id="mClass"></span></div>
    <div><span class="k">实验日期：</span><span class="v" id="mDate"></span></div>
  </div>

  <div class="section" id="secPurpose">
    <h3>实验题目</h3>
    <div class="body" id="bPurpose"></div>
    <div class="img-list" id="bPurposeImages"></div>
  </div>

  <div class="section" id="secPrinciple">
    <h3>实验原理与内容</h3>
    <div class="body" id="bPrinciple"></div>
  </div>

  <div class="section" id="secEnv">
    <h3>实验环境</h3>
    <div class="body" id="bEnv"></div>
  </div>

  <div class="section" id="secCode">
    <h3>程序代码</h3>
    <pre class="code-block" id="bCode"></pre>
  </div>

  <div class="section" id="secResult">
    <h3>运行结果</h3>
    <div class="body" id="bResult"></div>
    <div class="img-list" id="bResultImages"></div>
  </div>

  <div class="section" id="secSummary">
    <h3>实验总结</h3>
    <div class="body" id="bSummary"></div>
  </div>
</div>
<script src="script.js"></script>
</body>
</html>
